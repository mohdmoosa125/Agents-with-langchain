[project]
name = "learning-companion"
version = "0.1.0"
description = "Learning Companion Chatbot: Open WebUI to LangChain and Grok"
readme = "README.md"
authors = [
    { name = "mohdmoosa125", email = "mohd.musa.uddin6265@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "langchain>=1.4.4",
    "langchain-xai>=1.3.0",
    "langgraph>=1.2.14",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
learning-companion = "learning_companion.__main__:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
